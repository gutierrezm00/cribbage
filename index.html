    <input id="joinCode" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="CODE" value="${hashCode}">
    <button class="btn" id="ljoin">Join</button>
    <div class="lerr" id="lerr"></div>
    <button class="link" id="lboard">Just the board (playing with real cards)</button>`;
  $('lhost').onclick = () => hostStart(null);
  $('ljoin').onclick = () => guestJoin($('joinCode').value);
  $('joinCode').addEventListener('keydown', e => { if (e.key === 'Enter') guestJoin($('joinCode').value); });
  if (canResumeHost) $('lresH').onclick = () => hostStart(host);
  if (canRejoin) $('lresG').onclick = () => guestJoin(guest.code);
  $('lboard').onclick = () => {
    audio(); showGame();
    if (!pegs.some(p => holeN(p.hole) > 0)) setTimeout(() => toast('Grab a peg and drop it in a hole'), 400);
    introBeat();
  };
}

/* ---------- Rendering a view (both phones) ---------- */
let VIEW = null, boardGame = null, boardMs = null, moveQ = [], qBusy = false, lastLogS = null, sel = [];
function renderView(V) {
  const prev = VIEW; VIEW = V;
  if (!prev || prev.round !== V.round || prev.phase !== V.phase || prev.gameId !== V.gameId) sel = [];
  syncMeta(V); syncBoard(V);
  const fresh = V.log.filter(e => lastLogS !== null && e.s > lastLogS);
  if (fresh.length) toast(fresh[fresh.length - 1].t);
  lastLogS = V.log.length ? V.log[V.log.length - 1].s : 0;
  if (prev && V.phase === 'peg' && V.turn === V.me && (prev.turn !== V.me || prev.phase !== 'peg')) {
    try { navigator.vibrate && navigator.vibrate(25); } catch (e) {}
  }
  if (prev && V.pile.length > prev.pile.length) tock(0.5);
  renderTable();
  netStatus();
}
function syncMeta(V) {
  let plaques = false;
  if (S.names[0] !== V.names[0] || S.names[1] !== V.names[1]) { S.names[0] = V.names[0]; S.names[1] = V.names[1]; plaques = true; }
  if (V.colors && (S.colors[0] !== V.colors[0] || S.colors[1] !== V.colors[1])) {
    S.colors[0] = V.colors[0]; S.colors[1] = V.colors[1]; applyColors();
  }
  if (V.cast && V.cast.join() !== S.cast.join()) { S.cast = V.cast.slice(); castVoices = null; pegs.forEach(p => { p.lastLine = {}; }); plaques = true; }
  if (plaques) { renderPlaques(); renderMatch(); save(); }
}
const holeKey = (l, n, i) => n <= 0 ? `${l}:s${i}` : n >= 121 ? 'game' : `${l}:${n}`;
function snapPegs(P) {
  for (let l = 0; l < 2; l++) {
    const lp = pegs.filter(p => p.lane === l), want = P[l].slice().sort((a, b) => a - b);
    const have = lp.map(p => holeN(p.hole)).sort((a, b) => a - b);
    if (want[0] === have[0] && want[1] === have[1]) continue;
    lp.forEach((p, i) => { pegLayer.appendChild(p.el); sendTo(p, holeKey(l, want[i], i), true); });
  }
  refreshPlaques(); refreshNerves(); save();
}
function syncBoard(V) {
  if (boardGame !== V.gameId) {
    const rematch = boardGame !== null;
    boardGame = V.gameId; moveQ = [];
    if (rematch || V.ms === 0) {
      if (pegs.some(p => holeN(p.hole) > 0) || S.winner !== null) newGame();
      boardMs = 0;
    } else boardMs = null;
    if (V.ms === 0) return;
  }
  if (boardMs === V.ms) return;
  if (boardMs === null || !V.moves.length || V.moves[0].s > boardMs + 1) {   // first look at a game in progress, or missed moves
    moveQ = []; snapPegs(V.pegs); boardMs = V.ms;
    if (V.winner !== null && S.winner === null) { S.winner = V.winner; refreshNerves(); }
    return;
  }
  V.moves.filter(m => m.s > boardMs).forEach(m => moveQ.push(m));
  boardMs = V.ms;
  if (!qBusy) runQ();
}
function runQ() {
  const m = moveQ.shift();
  if (!m) { qBusy = false; return; }
  qBusy = true;
  const lp = pegs.filter(p => p.lane === m.l), [b, f] = m.to;
  const stay = lp.find(p => holeN(p.hole) === b), mover = lp.find(p => p !== stay);
  const key = f >= 121 ? 'game' : `${m.l}:${f}`;
  if (!stay || !mover || occupied(key, mover)) { moveQ = []; snapPegs(VIEW.pegs); qBusy = false; return; }
  if (holeN(mover.hole) !== f) {
    const before = laneScore(m.l), from = mover.hole;
    pick();
    pegLayer.appendChild(mover.el);
    sendTo(mover, key, false);
    afterMove(mover, before, from);
  }
  setTimeout(runQ, moveQ.length ? 1100 : 0);
}

function renderTable() {
  const V = VIEW, me = V.me, o = 1 - me;
  const nm = l => esc(V.names[l] || (l ? 'Guest' : 'Host'));
  const whose = l => l === me ? 'your' : `${nm(l)}’s`;
  $('oppWho').innerHTML = `<b>${nm(o)}</b>${V.dealer === o ? ' · dealer' : ''}${V.oppCount ? ` · ${V.oppCount} card${V.oppCount > 1 ? 's' : ''}` : ''}`;
  $('oppBacks').innerHTML = backsHtml(V.oppCount, 'xs');
  const cutter = V.phase === 'cut' && me !== V.dealer;
  $('deckSlot').innerHTML = V.starter !== null ? cardHtml(V.starter, 'sm starter') : `<div class="deck ${cutter ? 'can' : ''}" id="deck">${backsHtml(1, 'sm')}</div>`;
  $('deckCap').textContent = V.starter !== null ? 'Starter' : cutter ? 'Tap to cut' : 'Deck';
  $('crib').innerHTML = V.cribCount ? backsHtml(V.cribCount, 'xs') : '';
  $('cribCap').textContent = `${V.dealer === me ? 'Your' : V.names[V.dealer] + '’s'} crib`;
  const pegging = V.phase === 'peg';
  $('pile').innerHTML = V.pile.map((x, i) => cardHtml(x.c, `sm ${x.by === me ? 'mine' : 'theirs'} ${i === V.pile.length - 1 ? 'new' : ''}`)).join('');
  $('count').innerHTML = pegging || V.pile.length ? `${V.count}<small>COUNT</small>` : '';
  $('prev').innerHTML = pegging && V.prevPile.length ? V.prevPile.map(x => cardHtml(x.c, 'xs')).join('') : '';

  // the show
  const box = $('showBox');
  if (V.show && (V.phase === 'show' || V.phase === 'over')) {
    box.classList.add('on');
    box.innerHTML = V.show.items.map((it, i) => {
      const c = col(it.l), label = `${it.l === me ? 'Your' : nm(it.l) + '’s'} ${it.kind}`;
      if (i >= V.show.step) return `<div class="shw wait" style="--c:${c.base}"><div class="info"><div class="ttl">${label}</div><ul><li>not counted yet</li></ul></div></div>`;
      const cards = it.cards.slice().sort(byRank).map(x => cardHtml(x, 'xs')).join('') + cardHtml(V.starter, 'xs starter');
      const lines = it.parts.length ? it.parts.map(([t, n]) => `<li>${esc(t)} — ${n}</li>`).join('') : '<li>Nineteen (nothing) 😬</li>';
      return `<div class="shw" style="--c:${c.base}"><div class="cards">${cards}</div><div class="info"><div class="ttl">${label}</div><ul>${lines}</ul></div><div class="stot">${it.total}</div></div>`;
    }).join('');
  } else { box.classList.remove('on'); box.innerHTML = ''; }

  // status line
  let st = '', mine = false;
  switch (V.phase) {
    case 'lobby': st = 'Waiting for your partner…'; break;
    case 'discard':
      if (!V.discarded[me]) { st = `Pick 2 cards for ${whose(V.dealer)} crib`; mine = true; }
      else st = `Waiting for ${nm(o)} to discard…`;
      break;
    case 'cut': st = cutter ? 'Cut the deck' : `${nm(o)} is cutting…`; mine = cutter; break;
    case 'peg': st = V.turn === me ? 'Your turn' : `${nm(o)}’s turn…`; mine = V.turn === me; break;
    case 'show': st = V.show.step < 3 ? 'Count the hands' : 'All counted'; mine = true; break;
    case 'over': st = V.winner === me ? 'You win! 🎉' : `${nm(V.winner)} wins`; break;
  }
  $('status').textContent = st;
  $('status').classList.toggle('myturn', mine);
  $('lastlog').textContent = V.log.length ? V.log[V.log.length - 1].t : '';

  // my hand
  let cards, pickable = () => false;
  if (V.phase === 'discard' && !V.discarded[me]) { cards = V.hand.slice(); pickable = () => true; }
  else if (V.phase === 'peg') {
    cards = V.kept.slice();
    pickable = c => V.turn === me && V.hand.includes(c) && V.count + val(c) <= 31;
  } else cards = (V.kept.length ? V.kept : V.hand).slice();
  cards.sort(byRank);
  sel = sel.filter(c => cards.includes(c) && pickable(c));
  $('hand').innerHTML = cards.map(c => {
    const gone = V.phase === 'peg' && !V.hand.includes(c);
    const dim = gone || (V.phase === 'peg' && V.turn === me && !pickable(c));
    return cardHtml(c, `${sel.includes(c) ? 'sel' : ''} ${dim ? 'dim' : ''} ${gone ? 'gone' : ''}`);
  }).join('');

  // actions
  let acts = '';
  if (V.phase === 'discard' && !V.discarded[me]) acts = `<button class="btn" data-a="discard" ${sel.length === 2 ? '' : 'disabled'}>Send to ${V.dealer === me ? 'my' : esc(V.names[V.dealer]) + '’s'} crib</button>`;
  else if (cutter) acts = `<button class="btn" data-a="cut">Cut the deck</button>`;
  else if (pegging && V.turn === me) acts = `<button class="btn" data-a="play" ${sel.length === 1 ? '' : 'disabled'}>${sel.length ? `Play ${cardName(sel[0])} → ${V.count + val(sel[0])}` : 'Tap a card to play'}</button>`;
  else if (V.phase === 'show') {
    const nx = V.show.items[V.show.step];
    acts = nx ? `<button class="btn" data-a="next">Count ${nx.l === me ? 'your' : esc(V.names[nx.l]) + '’s'} ${nx.kind}</button>` : `<button class="btn" data-a="next">Next deal →</button>`;
  } else if (V.phase === 'over') acts = `<button class="btn" data-a="rematch">Rematch</button>`;
  $('acts').innerHTML = acts;
}
function act(a) {
  const V = VIEW; if (!V) return;
  audio();
  if (a === 'discard' && sel.length === 2) { netAct({ t: 'discard', cards: sel.slice() }); sel = []; }
  else if (a === 'cut') netAct({ t: 'cut' });
  else if (a === 'play' && sel.length === 1) { netAct({ t: 'play', c: sel[0] }); sel = []; }
  else if (a === 'next') netAct({ t: 'next' });
  else if (a === 'rematch') { hideWin(); netAct({ t: 'rematch' }); }
  renderTable();
}
$('acts').addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && !b.disabled) { tock(0.5); act(b.dataset.a); } });
$('deckSlot').addEventListener('click', e => { if (e.target.closest('.deck.can')) { tock(0.6); act('cut'); } });
$('hand').addEventListener('click', e => {
  const el = e.target.closest('.card'), V = VIEW; if (!el || !V) return;
  const c = +el.dataset.c;
  audio();
  if (V.phase === 'discard' && !V.discarded[me()]) {
    if (sel.includes(c)) sel = sel.filter(x => x !== c);
    else { sel.push(c); if (sel.length > 2) sel.shift(); }
    tick();
  } else if (V.phase === 'peg' && V.turn === me() && V.hand.includes(c)) {
    if (V.count + val(c) > 31) { toast(`That would make ${V.count + val(c)} — over 31`); return; }
    if (sel[0] === c) { act('play'); return; }        // tap a raised card again to play it
    sel = [c]; tick();
  } else return;
  renderTable();
});
const me = () => VIEW ? VIEW.me : 0;

/* ---------- Hooks into the board ---------- */
const baseSetColor = setColor;
setColor = function (l, ci) {
  if (NET.role === 'guest') { netAct({ t: 'color', l, ci }); closePicker(); return; }
  baseSetColor(l, ci);
  if (NET.role === 'host' && GM) { GM.colors = S.colors.slice(0, 2); commit(); }
};
const baseCast = $('castBtn').onclick;
$('castBtn').onclick = () => {
  if (NET.role === 'guest') { netAct({ t: 'recast' }); toast('Recasting…'); return; }
  baseCast();
  if (NET.role === 'host' && GM) { GM.cast = S.cast.slice(); commit(); }
};
const baseRematch = $('rematchBtn').onclick;
$('rematchBtn').onclick = () => { if (NET.role) act('rematch'); else baseRematch(); };
$('menuBtn').onclick = e => { e.stopPropagation(); audio(); document.querySelector('header .bar').classList.toggle('open'); };
document.addEventListener('click', e => { const bar = document.querySelector('header .bar'); if (!bar.contains(e.target) && !picker.contains(e.target)) bar.classList.remove('open'); });
$('leaveBtn').onclick = () => { if (confirm('Leave this game? You can rejoin or resume it from the start screen.')) location.reload(); };
document.addEventListener('visibilitychange', () => {   // phones drop sockets in the background: nudge a reconnect on return
  if (document.visibilityState === 'visible') NET.clients.forEach(c => { if (!c.connected) try { c.reconnect(); } catch (e) {} });
});
function onlineBoot() { lobbyHome(); }

onlineBoot();
</script>
</body>
</html>
